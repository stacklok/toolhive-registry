name: Update Server Metadata

on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of oldest entries to update'
        required: false
        default: '5'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-metadata:
    name: Update Server Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build catalog
        run: go build -o /tmp/catalog ./cmd/catalog

      - name: Determine count
        id: count
        run: echo "value=$INPUT_COUNT" >> $GITHUB_OUTPUT
        env:
          INPUT_COUNT: ${{ github.event.inputs.count || '5' }}

      - name: Update oldest entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_COUNT: ${{ steps.count.outputs.value }}
        run: |
          echo "Updating $UPDATE_COUNT oldest entries..."
          /tmp/catalog update-metadata \
            --oldest "$UPDATE_COUNT" \
            --github-token "$GITHUB_TOKEN" \
            -v

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          BRANCH="catalog-update-metadata-${RUN_NUMBER}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git checkout -B "$BRANCH"
          git add -u registries/
          git commit -m "chore: update registry metadata (stars and pulls)"
          git push -f origin "$BRANCH"

          gh pr create \
            --title "chore: update registry metadata" \
            --body "$(cat <<BODY
          ## Registry Metadata Update

          This PR updates the GitHub stars counts for the oldest registry entries
          (server.json format).

          Updated the **${UPDATE_COUNT}** oldest entries by \`last_updated\` timestamp.

          ---
          *This is an automated PR created by the daily metadata update workflow.*
          BODY
          )" \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          UPDATE_COUNT: ${{ steps.count.outputs.value }}
