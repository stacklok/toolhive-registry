name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 5:00 AM UTC, after the weekend merge window, so the
    # rebuild captures everything merged Fri-Sun before the Monday release fires.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: latest
          args: --timeout=5m

  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage reports
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2

      - name: Validate catalog entries
        run: task catalog:validate

  update-catalog-data:
    name: Update Catalog Data Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: update-catalog-data
      cancel-in-progress: false
    needs: [lint, validate-and-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get app user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "id=$USER_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2

      - name: Build registry files
        run: |
          task catalog:build
          for registry_dir in build/*/; do
            registry_name=$(basename "$registry_dir")
            [ -f "$registry_dir/registry-upstream.json" ] || continue
            mkdir -p "pkg/catalog/$registry_name/data"
            cp "$registry_dir/registry-upstream.json" "pkg/catalog/$registry_name/data/registry-upstream.json"
          done

      - name: Generate version
        id: metadata
        run: echo "version=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Open or update PR with catalog data files
        run: |
          BRANCH="update-catalog-data-${VERSION}"

          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Create or reset the branch
          git checkout -B "$BRANCH"

          # Stage only the catalog data files
          git add pkg/catalog/*/data/registry-upstream.json

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update catalog data files for v${VERSION}"
          git push -f origin "$BRANCH"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updated branch"
          else
            # Build file list dynamically
            FILE_LIST=""
            for registry_dir in pkg/catalog/*/; do
              registry_name=$(basename "$registry_dir")
              [ -d "$registry_dir/data" ] || continue
              FILE_LIST="${FILE_LIST}- \`pkg/catalog/${registry_name}/data/registry-upstream.json\` — ${registry_name} upstream MCP format
          "
            done

            gh pr create \
              --title "chore: update catalog data files for v${VERSION}" \
              --body "$(cat <<EOF
          Automated PR to update the embedded catalog data files.

          Files updated:
          ${FILE_LIST}
          When merged, a release will be created automatically.
          EOF
          )" \
              --head "$BRANCH"

            # Enable auto-merge
            gh pr merge "$BRANCH" --auto --squash || true
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}

  build-pr:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2

      - name: Build catalog files
        run: task catalog:build

      - name: Generate PR comment
        id: comment
        run: |
          {
            echo "body<<EOF"
            echo "## Registry Build Preview"
            echo ""
            echo "All registries built successfully!"
            echo ""

            for registry_dir in build/*/; do
              registry_name=$(basename "$registry_dir")
              upstream_file="$registry_dir/registry-upstream.json"
              [ -f "$upstream_file" ] || continue

              CONTAINER_COUNT=$(jq '[.data.servers[] | select(.packages != null and (.packages | length > 0))] | length' "$upstream_file")
              REMOTE_COUNT=$(jq '[.data.servers[] | select(.remotes != null and (.remotes | length > 0))] | length' "$upstream_file")
              TOTAL=$((CONTAINER_COUNT + REMOTE_COUNT))
              SKILL_COUNT=$(jq '.data.skills | length // 0' "$upstream_file")
              SIZE=$(du -h "$upstream_file" | cut -f1)
              LAST_UPDATED=$(jq -r '.meta.last_updated' "$upstream_file")

              echo "### Registry: \`$registry_name\`"
              echo ""
              echo "- **Total Servers**: $TOTAL"
              echo "  - Container-based: $CONTAINER_COUNT"
              echo "  - Remote: $REMOTE_COUNT"
              echo "- **Skills**: $SKILL_COUNT"
              echo "- **File Size**: $SIZE"
              echo "- **Last Updated**: $LAST_UPDATED"
              echo ""
            done

            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post or update PR comment
        run: |
          # Find existing comment
          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("Registry Build Preview"))][0].id' \
            2>/dev/null || true)

          if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --method PATCH \
              --field body="$COMMENT_BODY"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --method POST \
              --field body="$COMMENT_BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ steps.comment.outputs.body }}

      - name: Upload PR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-registry-json
          path: |
            build/*/registry-upstream.json
          retention-days: 7
